# Optional PostgreSQL (when Docker is available).
# Local development uses SQLite by default — see server/.env
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenwood
      POSTGRES_PASSWORD: greenwood
      POSTGRES_DB: greenwood
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
